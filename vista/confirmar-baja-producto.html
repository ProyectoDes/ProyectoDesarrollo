<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dar de baja producto - Bambú y Brillo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Pantalla 17 · Confirmación de baja de producto -->

  <main>
    <section id="confirmar-baja" role="alertdialog" aria-labelledby="titulo-baja" aria-describedby="texto-baja">
      <h1 id="titulo-baja">¿Dar de baja este producto?</h1>
      <p id="texto-baja">Cargando datos del producto...</p>

      <form id="form-baja-producto">
        <input type="hidden" id="id-producto" name="id" value="">
        <p class="error" id="mensaje-baja" role="alert" hidden></p>
        <button type="submit" id="btn-confirmar-baja">Dar de baja</button>
      </form>

      <a href="inventario.html" id="btn-cancelar">Cancelar</a>
    </section>
  </main>

  <script src="js/baja-producto.js"></script>
</body>
</html>
