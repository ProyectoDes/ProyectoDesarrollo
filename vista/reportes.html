<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes - Bambú y Brillo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Pantalla 18 · Reportes -->

  <header>
    <a href="mas.html" aria-label="Regresar a Más">&larr;</a>
    <h1>Reportes</h1>
    <p>Citas por periodo</p>
  </header>

  <main>
    <form id="form-periodo" action="reportes.html" method="get">
      <div>
        <label for="desde">Desde</label>
        <input type="date" id="desde" name="desde" required>
      </div>
      <div>
        <label for="hasta">Hasta</label>
        <input type="date" id="hasta" name="hasta" required>
      </div>
    </form>

    <section id="resumen">
      <h2 id="total-reporte">Cargando...</h2>
      <p id="periodo-reporte"></p>
    </section>

    <section id="desglose">
      <h2>Desglose por servicio</h2>
      <table>
        <tbody id="tabla-servicios"></tbody>
      </table>
      <p id="nota-reporte">Incluye todas las citas registradas en el rango seleccionado.</p>
    </section>
  </main>

  <script src="js/reportes.js"></script>
</body>
</html>
