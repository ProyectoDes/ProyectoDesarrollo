<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo cliente - Bambú y Brillo</title>
</head>
<body>

  <!-- Pantalla 02 · Registro de cliente -->

  <header>
    <a href="clientes.html" aria-label="Regresar a clientes">&larr;</a>
    <h1>Nuevo cliente</h1>
  </header>

  <main>
    <p>Agrega los datos de contacto para registrar a tu cliente.</p>

    <form id="form-registrar-cliente" action="clientes.html" method="get">
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Elena Ruiz" maxlength="80" required>
        <p class="error" id="error-nombre" hidden></p>
      </div>

      <div>
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="5512345678" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
        <p class="error" id="error-telefono" hidden>Ingresa un teléfono de 10 dígitos.</p>
      </div>

      <div>
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="elena.ruiz@example.com">
        <p class="error" id="error-correo" hidden></p>
      </div>

      <p id="mensaje-formulario" role="status" hidden></p>

      <button type="submit" id="btn-guardar">Guardar</button>
    </form>
  </main>

</body>
</html>
