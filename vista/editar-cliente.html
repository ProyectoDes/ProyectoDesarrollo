<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar perfil del cliente - Bambú y Brillo</titl
  <link rel="stylesheet" href="css/estilos.css">e>
</head>
<body>

  <!-- Pantalla Editar perfil del cliente (sin número en el Figma) -->

  <header>
    <a href="perfil-cliente.html?id=1" aria-label="Regresar al perfil">&larr;</a>
    <h1>Editar perfil del cliente</h1>
  </header>

  <main>
    <p>Actualiza los datos de contacto de tu cliente.</p>

    <form id="form-editar-cliente" action="perfil-cliente.html" method="get">
      <input type="hidden" id="id-cliente" name="id" value="1">

      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" value="Ana Martínez" maxlength="80" required>
        <p class="error" id="error-nombre" hidden></p>
      </div>

      <div>
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" value="5512345678" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
        <p class="error" id="error-telefono" hidden>Ingresa un teléfono de 10 dígitos.</p>
      </div>

      <div>
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" value="ana.martinez@example.com">
        <p class="error" id="error-correo" hidden></p>
      </div>

      <p id="mensaje-formulario" role="status" hidden></p>

      <button type="submit" id="btn-guardar">Guardar cambios</button>
    </form>
  </main>

</body>
</html>
