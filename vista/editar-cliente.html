<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar perfil del cliente - Bambú y Brillo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Pantalla Editar perfil del cliente (sin número en el Figma) -->

  <header>
    <a href="clientes.html" id="btn-regresar" aria-label="Regresar al perfil">&larr;</a>
    <h1>Editar perfil del cliente</h1>
  </header>

  <main>
    <p>Actualiza los datos de contacto de tu cliente.</p>

    <form id="form-editar-cliente">
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="80" required>
        <p class="error" id="error-nombre" hidden></p>
      </div>

      <div>
        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" min="1" max="120" required>
        <p class="error" id="error-edad" hidden></p>
      </div>

      <div>
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
        <p class="error" id="error-telefono" hidden>Ingresa un teléfono de 10 dígitos.</p>
      </div>

      <p id="mensaje-formulario" role="status" hidden></p>

      <button type="submit" id="btn-guardar" disabled>Guardar cambios</button>
    </form>
  </main>

  <script src="js/editar-cliente.js"></script>
</body>
</html>
