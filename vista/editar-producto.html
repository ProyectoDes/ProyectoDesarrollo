<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar producto - Bambú y Brillo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Pantalla 16 · Modificación de producto -->

  <header>
    <a href="inventario.html" aria-label="Regresar al inventario">&larr;</a>
    <h1>Editar producto</h1>
  </header>

  <main>
    <p>Modifica los datos o actualiza las existencias de este producto.</p>

    <form id="form-editar-producto" action="inventario.html" method="get">
      <input type="hidden" id="id-producto" name="id" value="">

      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="60" required>
        <p class="error" id="error-nombre" hidden></p>
      </div>

      <div>
        <label for="descripcion">Descripción</label>
        <input type="text" id="descripcion" name="descripcion" maxlength="120" placeholder="Opcional">
        <p class="error" id="error-descripcion" hidden></p>
      </div>

      <div>
        <label for="cantidad">Cantidad disponible</label>
        <input type="number" id="cantidad" name="cantidad" min="0" step="1" required>
        <small>Cantidad en unidades. Usa un número entero.</small>
        <p class="error" id="error-cantidad" hidden></p>
      </div>

      <p id="mensaje-formulario" role="status" hidden></p>

      <button type="submit" id="btn-guardar">Guardar cambios</button>
    </form>

    <a href="confirmar-baja-producto.html" id="btn-dar-baja">Dar de baja</a>
  </main>

  <script src="js/editar-producto.js"></script>
</body>
</html>
